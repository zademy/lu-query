name: publish

# Se dispara con el push a master y no con el evento de release: la release la crea
# release.yml usando GITHUB_TOKEN, y GitHub no ejecuta workflows por eventos generados
# con su propio token. El push si lo dispara el merge, asi que este workflow corre.
on:
  push:
    branches: [master]

permissions:
  id-token: write # OIDC: npm no pide token ni codigo OTP
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest # npm solo acepta OIDC de runners alojados por GitHub
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24' # npm exige Node >= 22.14.0 y CLI >= 11.5.1 para OIDC
          package-manager-cache: false

      - name: Dependencias
        run: npm ci

      - name: Diagnostico OIDC
        run: |
          echo "npm=$(npm --version) node=$(node --version)"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo si || echo NO)"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo si || echo NO)"
          echo "NODE_AUTH_TOKEN: $([ -n "$NODE_AUTH_TOKEN" ] && echo si || echo NO)"
          ID=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0,'utf8')).value||'')")
          echo "claims:"
          node -e "console.log(JSON.stringify(JSON.parse(Buffer.from(process.argv[1].split('.')[1],'base64url').toString()),null,1))" "$ID"
          echo "intercambio:"
          curl -s -X POST -H "Authorization: Bearer $ID" -H "Content-Type: application/json" https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/lu-query | head -c 800
          echo

      - name: Publicar en npm con trusted publishing
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "lu-query@$VERSION" version > /dev/null 2>&1; then
            echo "::notice::$VERSION ya esta en npm; nada que publicar."
            exit 0
          fi
          npm publish # prepublishOnly ya compila dist/
