name: publish

# Se dispara con el push a master y no con el evento de release: la release la crea
# release.yml usando GITHUB_TOKEN, y GitHub no ejecuta workflows por eventos generados
# con su propio token. El push si lo dispara el merge, asi que este workflow corre.
on:
  push:
    branches: [master]

permissions:
  id-token: write # OIDC: npm no pide token ni codigo OTP
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest # npm solo acepta OIDC de runners alojados por GitHub
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24' # npm exige Node >= 22.14.0 y CLI >= 11.5.1 para OIDC
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Dependencias
        run: npm ci

      - name: Diagnostico OIDC
        run: |
          echo "npm=$(npm --version) node=$(node --version)"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL definido: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo si || echo NO)"
          curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" > /tmp/oidc.json
          node -e "const v=JSON.parse(require('fs').readFileSync('/tmp/oidc.json','utf8')).value||''; const p=v.split('.')[1]||''; console.log(JSON.stringify(JSON.parse(Buffer.from(p,'base64').toString()),null,1))"

      - name: Publicar en npm con trusted publishing
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "lu-query@$VERSION" version > /dev/null 2>&1; then
            echo "::notice::$VERSION ya esta en npm; nada que publicar."
            exit 0
          fi
          npm publish # prepublishOnly ya compila dist/
