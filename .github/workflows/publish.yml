name: publish

on:
  release:
    types: [published]

permissions:
  id-token: write # OIDC: npm no pide token ni OTP. Sin esto una cuenta con 2FA no puede publicar en un pipeline.
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest # npm solo acepta OIDC de runners alojados por GitHub
    steps:
      # El evento release deja GITHUB_REF en el tag, asi que esto checkouta la release publicada.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24' # npm exige Node >= 22.14.0 y CLI >= 11.5.1 para OIDC
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Instalar dependencias
        run: npm ci

      - name: Publicar en npm con trusted publishing
        run: npm publish # prepublishOnly ya compila dist/
