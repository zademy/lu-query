name: release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # crear la release
  id-token: write # OIDC: npm no pide token ni codigo OTP

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24' # npm exige Node >= 22.14.0 y CLI >= 11.5.1 para OIDC
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Generar notas de release (estilo Spring Boot)
        run: |
          node scripts/release-notes.mjs --self-test
          node scripts/release-notes.mjs > release-notes.md
          echo "## Preview"
          head -20 release-notes.md

      - name: Crear release desde la version de package.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::El release $TAG ya existe; sube la version en package.json para publicar uno nuevo."
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --target "$GITHUB_SHA" --notes-file release-notes.md

      - name: Dependencias
        run: npm ci

      - name: Publicar en npm con trusted publishing
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "lu-query@$VERSION" version > /dev/null 2>&1; then
            echo "::notice::$VERSION ya esta en npm; nada que publicar."
            exit 0
          fi
          npm publish # prepublishOnly ya compila dist/
