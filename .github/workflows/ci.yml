name: ci

# Los tests corren en PRs y tras el merge a develop: nunca en pushes a
# ramas feature (antes cada commit corria la matriz dos veces: push + PR).
# El push a develop valida la integracion (merge skew) y los push directos;
# master no necesita push: solo avanza por PR y su arbol ya se valido ahi.
on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ejes: SO x Node. El nombre del job alimenta los required checks de master.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci

      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Unit + smoke tests: sin Oracle (la suite integration requiere contenedor real).
      - run: npm test
      - run: npm run build

      # La suite de integracion necesita un Oracle real; corre solo en Linux por el soporte
      # del script de grants (docker exec sqlplus). Ver CONTRIBUTING.md.
